<script>

/* =========================
   SAVE DATA
========================= */

let savedData =
    JSON.parse(localStorage.getItem("guess45Data")) || {
        coins: 0,
        xp: 0,
        level: 1,
        best: 0
    };

let coins = savedData.coins;
let xp = savedData.xp;
let level = savedData.level;
let best = savedData.best;


/* =========================
   GAME VARIABLES
========================= */

let secretNumber = 0;
let time = 45;
let score = 0;
let round = 1;
let lives = 3;
let combo = 1;
let timerInterval = null;
let gameRunning = false;

let choicesVisible = false;

let currentChallenge = "NORMAL";
let challengeType = "normal";
let dangerLevel = 1;

let guessesThisRound = 0;
let roundRewardMultiplier = 1;


/* =========================
   CREATE CHALLENGE UI
========================= */

function createChallengeUI() {

    if(document.getElementById("challengeBox")) {
        return;
    }

    let comboBox =
        document.getElementById("comboText");

    let box =
        document.createElement("div");

    box.id = "challengeBox";

    box.style.margin = "15px auto";
    box.style.padding = "12px";
    box.style.maxWidth = "360px";
    box.style.border = "1px solid rgba(255,0,0,.5)";
    box.style.borderRadius = "12px";
    box.style.background = "rgba(20,0,0,.75)";
    box.style.boxShadow = "0 0 20px rgba(255,0,0,.25)";
    box.style.fontWeight = "bold";
    box.style.fontSize = "14px";

    box.innerHTML =
        "⚠️ DANGER LEVEL <span id='dangerLevel'>1</span><br>" +
        "<span id='challengeName'>NORMAL ROUND</span>";

    comboBox.after(box);
}


/* =========================
   SAVE
========================= */

function saveData() {

    localStorage.setItem(
        "guess45Data",
        JSON.stringify({
            coins: coins,
            xp: xp,
            level: level,
            best: best
        })
    );

    updateHomeStats();
}


/* =========================
   HOME STATS
========================= */

function updateHomeStats() {

    document.getElementById("homeCoins").textContent = coins;
    document.getElementById("homeXP").textContent = xp;
    document.getElementById("homeLevel").textContent = level;
    document.getElementById("homeBest").textContent = best;
}

updateHomeStats();


/* =========================
   START GAME
========================= */

function startGame() {

    document.getElementById("homePage").style.display = "none";
    document.getElementById("gamePage").style.display = "block";
    document.getElementById("gameOver").style.display = "none";

    score = 0;
    round = 1;
    lives = 3;
    combo = 1;
    dangerLevel = 1;

    gameRunning = true;

    createChallengeUI();

    updateGameStats();

    newRound();
}


/* =========================
   NEW ROUND
========================= */

function newRound() {

    if(!gameRunning) {
        return;
    }

    secretNumber =
        Math.floor(Math.random() * 100) + 1;

    choicesVisible = false;

    guessesThisRound = 0;

    roundRewardMultiplier = 1;

    /* =====================
       DANGER LEVEL
    ===================== */

    dangerLevel =
        Math.min(
            10,
            Math.floor((round - 1) / 2) + 1
        );


    /* =====================
       BOSS ROUND
    ===================== */

    if(round % 5 === 0) {

        challengeType = "boss";

        currentChallenge =
            "💀 BOSS ROUND — SURVIVE!";

        time = 25;

        roundRewardMultiplier = 3;

    }

    else {

        let challenges = [
            {
                type: "normal",
                name: "😈 NORMAL — NO MERCY",
                time: 45,
                multiplier: 1
            },

            {
                type: "fast",
                name: "⚡ SPEED DEMON — 30 SECONDS",
                time: 30,
                multiplier: 1.5
            },

            {
                type: "nohint",
                name: "🚫 NO HINT — YOU'RE ALONE",
                time: 45,
                multiplier: 1.5
            },

            {
                type: "oneshot",
                name: "🎯 ONE SHOT — DON'T MISS",
                time: 35,
                multiplier: 2
            },

            {
                type: "double",
                name: "💰 DOUBLE REWARD",
                time: 40,
                multiplier: 2
            }
        ];


        /* كلما زاد الـDanger
           نخلي الجولات أصعب */

        let available =
            challenges.slice(
                0,
                Math.min(
                    challenges.length,
                    2 + dangerLevel
                )
            );


        let selected =
            available[
                Math.floor(
                    Math.random() *
                    available.length
                )
            ];


        challengeType =
            selected.type;

        currentChallenge =
            selected.name;

        time =
            selected.time;

        roundRewardMultiplier =
            selected.multiplier;
    }


    /* =====================
       UPDATE CHALLENGE UI
    ===================== */

    document.getElementById(
        "dangerLevel"
    ).textContent = dangerLevel;

    document.getElementById(
        "challengeName"
    ).textContent = currentChallenge;


    /* =====================
       HIDE CHOICES
    ===================== */

    document.getElementById(
        "choices"
    ).style.display = "none";

    document.getElementById(
        "choiceTitle"
    ).style.display = "none";


    /* =====================
       TIMER
    ===================== */

    document.getElementById(
        "timer"
    ).textContent = time;


    document.getElementById(
        "round"
    ).textContent = round;


    document.getElementById(
        "guessInput"
    ).value = "";


    document.getElementById(
        "message"
    ).textContent =
        currentChallenge;


    updateLives();
    updateCombo();
    updateGameStats();

    createChoices();


    clearInterval(timerInterval);


    timerInterval =
        setInterval(
            timerTick,
            1000
        );
}


/* =========================
   TIMER
========================= */

function timerTick() {

    if(!gameRunning) {
        return;
    }

    time--;

    document.getElementById(
        "timer"
    ).textContent = time;


    /* خطر أكبر */

    if(time <= 10 && time > 0) {

        document.getElementById(
            "timer"
        ).style.color = "#ff0000";
    }


    /* TIME OVER */

    if(time <= 0) {

        clearInterval(timerInterval);

        time = 0;

        document.getElementById(
            "timer"
        ).textContent = "0";

        choicesVisible = true;


        document.getElementById(
            "choices"
        ).style.display = "grid";


        document.getElementById(
            "choiceTitle"
        ).style.display = "block";


        document.getElementById(
            "message"
        ).textContent =
            challengeType === "boss"
            ? "💀 BOSS TIME! CHOOSE CAREFULLY!"
            : "⏰ TIME'S UP! CHOOSE NOW! 😈";
    }
}


/* =========================
   NORMAL GUESS
========================= */

function makeGuess() {

    if(!gameRunning) {
        return;
    }

    if(choicesVisible) {
        return;
    }

    let input =
        document.getElementById(
            "guessInput"
        );

    let guess =
        Number(input.value);


    if(
        !guess ||
        guess < 1 ||
        guess > 100
    ) {

        showMessage(
            "ENTER A NUMBER FROM 1 TO 100"
        );

        return;
    }


    guessesThisRound++;


    /* =====================
       ONE SHOT
    ===================== */

    if(
        challengeType === "oneshot" &&
        guessesThisRound > 1
    ) {

        showMessage(
            "🎯 ONE SHOT! ROUND LOST!"
        );

        loseLife();

        return;
    }


    checkGuess(guess);
}


/* =========================
   CHECK GUESS
========================= */

function checkGuess(guess) {

    if(!gameRunning) {
        return;
    }


    /* =====================
       CORRECT
    ===================== */

    if(guess === secretNumber) {

        clearInterval(timerInterval);


        let reward =
            Math.floor(
                100 *
                combo *
                roundRewardMultiplier
            );


        /* BOSS BONUS */

        if(challengeType === "boss") {

            reward += 500;

            coins += 25;

            xp += 100;

            showMessage(
                "💀 BOSS DEFEATED! +" +
                reward +
                " SCORE 🔥"
            );

        }

        else {

            coins += 5;

            xp +=
                challengeType === "double"
                ? 50
                : 25;

            showMessage(
                "🔥 CORRECT! +" +
                reward +
                " SCORE"
            );
        }


        score += reward;


        /* =====================
           LEVEL UP
        ===================== */

        if(
            xp >= level * 100
        ) {

            xp -= level * 100;

            level++;

            showMessage(
                "🔥 LEVEL UP! LEVEL " +
                level
            );
        }


        combo++;


        /* كل 5 كومبو مكافأة */

        if(combo % 5 === 0) {

            coins += 20;

            showMessage(
                "🔥🔥 COMBO MASTER! +20 COINS"
            );
        }


        round++;


        if(score > best) {

            best = score;
        }


        saveData();

        updateGameStats();


        setTimeout(
            newRound,
            1200
        );


        return;
    }


    /* =====================
       WRONG
    ===================== */

    if(guess > secretNumber) {

        showMessage(
            "⬇️ LOWER!"
        );

    }

    else {

        showMessage(
            "⬆️ HIGHER!"
        );
    }


    /* ONE SHOT FAIL */

    if(
        challengeType === "oneshot"
    ) {

        setTimeout(
            function() {

                loseLife();

            },
            300
        );
    }
}


/* =========================
   LOSE LIFE
========================= */

function loseLife() {

    lives--;

    combo = 1;

    updateLives();
    updateCombo();


    if(lives <= 0) {

        endGame();

        return;
    }


    showMessage(
        "💔 LIFE LOST! " +
        lives +
        " LIVES LEFT"
    );


    clearInterval(timerInterval);


    setTimeout(
        newRound,
        1000
    );
}


/* =========================
   FOUR CHOICES
========================= */

function createChoices() {

    let container =
        document.getElementById(
            "choices"
        );

    container.innerHTML = "";

    let values = [];

    values.push(secretNumber);


    while(values.length < 4) {

        let n =
            Math.floor(
                Math.random() * 100
            ) + 1;

        if(!values.includes(n)) {

            values.push(n);
        }
    }


    values.sort(
        () => Math.random() - .5
    );


    values.forEach(
        function(number) {

            let button =
                document.createElement(
                    "button"
                );

            button.className =
                "choice";

            button.textContent =
                number;


            button.onclick =
                function() {

                    if(!choicesVisible) {
                        return;
                    }

                    checkGuess(number);

                };


            container.appendChild(
                button
            );
        }
    );
}


/* =========================
   LIVES
========================= */

function updateLives() {

    let text = "";

    for(
        let i = 0;
        i < lives;
        i++
    ) {

        text += "❤️ ";
    }


    for(
        let i = lives;
        i < 3;
        i++
    ) {

        text += "🖤 ";
    }


    document.getElementById(
        "lives"
    ).textContent = text;
}


/* =========================
   COMBO
========================= */

function updateCombo() {

    document.getElementById(
        "comboText"
    ).textContent =
        "🔥 COMBO x" + combo;
}


/* =========================
   +5 SEC
========================= */

function addTime() {

    if(coins < 10) {

        showMessage(
            "NOT ENOUGH COINS 🪙"
        );

        return;
    }


    /* NO HINT تحدي لا يمنع الوقت */

    coins -= 10;

    time += 5;


    document.getElementById(
        "timer"
    ).textContent = time;


    if(time > 0) {

        choicesVisible = false;


        document.getElementById(
            "choices"
        ).style.display = "none";


        document.getElementById(
            "choiceTitle"
        ).style.display = "none";
    }


    saveData();

    updateGameStats();


    showMessage(
        "⏱️ +5 SECONDS!"
    );
}


/* =========================
   HINT
========================= */

function useHint() {

    if(
        challengeType === "nohint" ||
        challengeType === "boss"
    ) {

        showMessage(
            "🚫 HINT DISABLED THIS ROUND!"
        );

        return;
    }


    if(coins < 15) {

        showMessage(
            "NOT ENOUGH COINS 🪙"
        );

        return;
    }


    coins -= 15;


    let hint;


    if(secretNumber < 25) {

        hint =
            "💡 VERY LOW — BELOW 25";

    }

    else if(secretNumber < 50) {

        hint =
            "💡 LOW — 25 TO 49";

    }

    else if(secretNumber < 75) {

        hint =
            "💡 HIGH — 50 TO 74";

    }

    else {

        hint =
            "💡 VERY HIGH — 75 TO 100";
    }


    showMessage(hint);

    saveData();

    updateGameStats();
}


/* =========================
   FREE GUESS
========================= */

function freeGuess() {

    if(coins < 20) {

        showMessage(
            "NOT ENOUGH COINS 🪙"
        );

        return;
    }


    coins -= 20;

    saveData();

    updateGameStats();


    showMessage(
        "🎁 FREE GUESS ACTIVATED!"
    );
}


/* =========================
   AD PLACEHOLDER
========================= */

function rewardAd(type) {

    if(type === "coins") {

        coins += 20;

        showMessage(
            "🪙 +20 COINS!"
        );
    }


    if(type === "time") {

        time += 10;


        document.getElementById(
            "timer"
        ).textContent = time;


        choicesVisible = false;


        document.getElementById(
            "choices"
        ).style.display = "none";


        document.getElementById(
            "choiceTitle"
        ).style.display = "none";


        showMessage(
            "⏱️ +10 SECONDS!"
        );
    }


    saveData();

    updateGameStats();
}


/* =========================
   MESSAGE
========================= */

function showMessage(text) {

    document.getElementById(
        "message"
    ).textContent = text;
}


/* =========================
   GAME STATS
========================= */

function updateGameStats() {

    document.getElementById(
        "score"
    ).textContent = score;

    document.getElementById(
        "coins"
    ).textContent = coins;

    document.getElementById(
        "xp"
    ).textContent = xp;

    document.getElementById(
        "level"
    ).textContent = level;
}


/* =========================
   ENTER
========================= */

function enterGuess(event) {

    if(event.key === "Enter") {

        makeGuess();
    }
}


/* =========================
   GAME OVER
========================= */

function endGame() {

    gameRunning = false;

    clearInterval(timerInterval);


    if(score > best) {

        best = score;
    }


    saveData();


    document.getElementById(
        "finalScore"
    ).textContent = score;


    document.getElementById(
        "gameOver"
    ).style.display = "block";


    document.getElementById(
        "message"
    ).textContent =
        "💀 YOU DIED...";


    document.getElementById(
        "choices"
    ).style.display = "none";


    document.getElementById(
        "choiceTitle"
    ).style.display = "none";
}


/* =========================
   RESTART
========================= */

function restartGame() {

    document.getElementById(
        "gameOver"
    ).style.display = "none";


    score = 0;

    round = 1;

    lives = 3;

    combo = 1;

    dangerLevel = 1;

    gameRunning = true;


    updateGameStats();

    newRound();
}


/* =========================
   BACK MENU
========================= */

function backToMenu() {

    gameRunning = false;


    clearInterval(
        timerInterval
    );


    document.getElementById(
        "gamePage"
    ).style.display = "none";


    document.getElementById(
        "homePage"
    ).style.display = "block";


    updateHomeStats();
}

</script>
