<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GUESS 45</title>

<meta name="description"
content="Play GUESS 45 online - The 45 Second Challenge.">

<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {

    min-height: 100vh;

    overflow-x: hidden;

    color: white;

    font-family: Arial, sans-serif;

    background:

        radial-gradient(
            ellipse at 50% 35%,
            rgba(120,0,0,.45),
            transparent 32%
        ),

        radial-gradient(
            ellipse at 20% 80%,
            rgba(90,0,100,.3),
            transparent 35%
        ),

        linear-gradient(
            180deg,
            #020002 0%,
            #080008 50%,
            #010001 100%
        );
}


/* =========================
   RED HORROR LIGHT
========================= */

body::before {

    content: "";

    position: fixed;

    width: 650px;
    height: 650px;

    left: 50%;
    top: 30%;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(255,0,0,.22),
            rgba(100,0,0,.08) 35%,
            transparent 70%
        );

    filter: blur(30px);

    animation:
        redPulse 3s infinite alternate;

    pointer-events: none;

    z-index: 0;
}


@keyframes redPulse {

    from {

        opacity: .35;

        transform:
            translate(-50%,-50%)
            scale(.85);
    }

    to {

        opacity: .8;

        transform:
            translate(-50%,-50%)
            scale(1.15);
    }
}


/* =========================
   GAME CONTAINER
========================= */

.game {

    position: relative;

    z-index: 2;

    width: 100%;

    min-height: 100vh;

    padding: 20px;

    text-align: center;
}


/* =========================
   HOME PAGE
========================= */

#homePage {

    width: 100%;

    max-width: 600px;

    margin: auto;

    padding-top: 70px;
}


/* =========================
   TITLE
========================= */

h1 {

    margin: 0;

    font-size:
        clamp(50px,14vw,85px);

    font-weight: 900;

    letter-spacing: 5px;

    color: #ff1010;

    text-shadow:

        0 0 5px #ff0000,

        0 0 15px #ff0000,

        0 0 35px #9b0000,

        0 0 70px rgba(255,0,0,.5);

    animation:
        horrorTitle 3s infinite;
}


@keyframes horrorTitle {

    0%,
    18%,
    20%,
    60%,
    62%,
    100% {

        opacity: 1;
    }

    19%,
    61% {

        opacity: .35;
    }
}


/* =========================
   SUBTITLE
========================= */

h2 {

    color: #ff8a8a;

    letter-spacing: 3px;

    text-shadow:
        0 0 12px red;
}


/* =========================
   STATS
========================= */

.stats {

    margin: 30px auto;

    padding: 18px;

    max-width: 340px;

    background:
        rgba(0,0,0,.65);

    border:
        1px solid rgba(255,0,0,.35);

    border-radius: 12px;

    color: #ffd34e;

    box-shadow:
        0 0 25px rgba(255,0,0,.2);
}


/* =========================
   START
========================= */

.start {

    width:
        min(330px,90%);

    height: 75px;

    font-size: 25px;

    font-weight: bold;

    color: white;

    border: none;

    border-radius: 10px;

    cursor: pointer;

    background:

        linear-gradient(
            180deg,
            #b50000,
            #480000
        );

    box-shadow:
        0 0 20px rgba(255,0,0,.5);

    transition: .15s;
}


.start:hover {

    filter: brightness(1.3);

}


.start:active {

    transform: scale(.94);
}


/* =========================
   GAME PAGE
========================= */

#gamePage {

    display: none;

    width: 100%;

    max-width: 600px;

    margin: auto;

    padding-top: 35px;
}


/* =========================
   TIMER
========================= */

.timer {

    font-size:
        clamp(75px,20vw,120px);

    font-weight: 900;

    color: #ff1111;

    text-shadow:

        0 0 8px red,

        0 0 25px red,

        0 0 60px rgba(255,0,0,.6);

    animation:
        timerPulse 1s infinite alternate;
}


@keyframes timerPulse {

    from {

        transform: scale(1);
    }

    to {

        transform: scale(1.06);
    }
}


/* =========================
   INPUT
========================= */

#guessInput {

    width:
        min(340px,90%);

    height: 65px;

    border-radius: 10px;

    border:
        1px solid #700000;

    outline: none;

    background:
        rgba(0,0,0,.85);

    color: white;

    text-align: center;

    font-size: 25px;

    box-shadow:
        0 0 15px rgba(255,0,0,.2);
}


#guessInput:focus {

    border-color: red;

    box-shadow:
        0 0 25px rgba(255,0,0,.5);
}


/* =========================
   GUESS BUTTON
========================= */

.guess {

    width: 240px;

    height: 65px;

    margin: 20px auto;

    font-size: 24px;

    font-weight: bold;

    color: white;

    border: none;

    border-radius: 10px;

    background:

        linear-gradient(
            180deg,
            #a00000,
            #420000
        );

    box-shadow:
        0 0 20px rgba(255,0,0,.45);
}


/* =========================
   MESSAGE
========================= */

#message {

    min-height: 35px;

    margin: 15px;

    font-size: 20px;

    font-weight: bold;
}


/* =========================
   MENU BUTTON
========================= */

.menuButton {

    margin-top: 25px;

    padding: 14px 30px;

    color: white;

    border: none;

    border-radius: 10px;

    background: #222;

    cursor: pointer;
}


/* =========================
   MOBILE
========================= */

@media (max-width:500px) {

    #homePage {

        padding-top: 45px;
    }

    #gamePage {

        padding-top: 25px;
    }
}

</style>

</head>


<body>


<div class="game">


<!-- =================================
     HOME PAGE
================================= -->

<section id="homePage">

    <h1>
        GUESS 45
    </h1>

    <h2>
        THE 45 SECOND CHALLENGE
    </h2>


    <div class="stats">

        LEVEL:
        <span id="level">
            1
        </span>

        <br><br>

        COINS:
        <span id="coins">
            0
        </span>

        <br><br>

        BEST:
        <span id="best">
            0
        </span>

    </div>


    <button
        class="start"
        onclick="startGame()">

        START GAME

    </button>

</section>



<!-- =================================
     GAME PAGE
================================= -->

<section id="gamePage">

    <h2>
        GUESS THE NUMBER
    </h2>


    <div class="timer"
         id="timer">

        45

    </div>


    <p>

        ROUND:
        <span id="round">
            1
        </span>

    </p>


    <p>

        SCORE:
        <span id="score">
            0
        </span>

    </p>


    <input
        id="guessInput"
        type="number"
        min="1"
        max="100"
        placeholder="1 - 100">


    <br>


    <button
        class="guess"
        onclick="makeGuess()">

        GUESS

    </button>


    <div id="message"></div>


    <button
        class="menuButton"
        onclick="backToMenu()">

        BACK TO MENU

    </button>

</section>


</div>



<script>

let secretNumber;

let time = 45;

let timerInterval;

let score = 0;

let round = 1;

let coins = 0;

let best =
    Number(
        localStorage.getItem(
            "guess45Best"
        )
    ) || 0;


document.getElementById("best")
    .textContent = best;



function startGame() {

    document.getElementById(
        "homePage"
    ).style.display = "none";


    document.getElementById(
        "gamePage"
    ).style.display = "block";


    score = 0;

    round = 1;

    newRound();
}



function newRound() {

    secretNumber =
        Math.floor(
            Math.random() * 100
        ) + 1;


    time = 45;


    document.getElementById(
        "timer"
    ).textContent = time;


    document.getElementById(
        "round"
    ).textContent = round;


    document.getElementById(
        "score"
    ).textContent = score;


    document.getElementById(
        "message"
    ).textContent = "";


    document.getElementById(
        "guessInput"
    ).value = "";


    clearInterval(
        timerInterval
    );


    timerInterval =
        setInterval(
            timerTick,
            1000
        );
}



function timerTick() {

    time--;


    document.getElementById(
        "timer"
    ).textContent = time;


    if(time <= 0) {

        clearInterval(
            timerInterval
        );


        document.getElementById(
            "message"
        ).textContent =
            "TIME'S UP! 😈";
    }
}



function makeGuess() {

    let guess =
        Number(
            document.getElementById(
                "guessInput"
            ).value
        );


    if(!guess) {

        return;
    }


    if(guess === secretNumber) {

        clearInterval(
            timerInterval
        );


        score += 100;

        coins += 10;

        round++;


        document.getElementById(
            "score"
        ).textContent = score;


        document.getElementById(
            "coins"
        ).textContent = coins;


        if(score > best) {

            best = score;


            localStorage.setItem(
                "guess45Best",
                best
            );


            document.getElementById(
                "best"
            ).textContent = best;
        }


        document.getElementById(
            "message"
        ).textContent =
            "🔥 CORRECT! +100 SCORE";


        setTimeout(
            newRound,
            900
        );


    }

    else if(guess > secretNumber) {

        document.getElementById(
            "message"
        ).textContent =
            "⬇️ LOWER!";
    }


    else {

        document.getElementById(
            "message"
        ).textContent =
            "⬆️ HIGHER!";
    }
}



function backToMenu() {

    clearInterval(
        timerInterval
    );


    document.getElementById(
        "gamePage"
    ).style.display = "none";


    document.getElementById(
        "homePage"
    ).style.display = "block";
}

</script>


</body>

</html>
