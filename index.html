<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GUESS 45</title>

<meta name="description"
content="GUESS 45 - The 45 Second Challenge">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(140,0,0,.45),
            transparent 30%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(80,0,90,.25),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #020002,
            #090008,
            #000000
        );
}

/* RED LIGHT */

body::before {
    content: "";

    position: fixed;

    width: 600px;
    height: 600px;

    left: 50%;
    top: 35%;

    transform: translate(-50%,-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,0,0,.22),
            transparent 70%
        );

    filter: blur(30px);

    animation: pulse 3s infinite alternate;

    pointer-events: none;
}

@keyframes pulse {
    from {
        opacity: .3;
        transform:
            translate(-50%,-50%)
            scale(.85);
    }

    to {
        opacity: .8;
        transform:
            translate(-50%,-50%)
            scale(1.15);
    }
}

.game {
    position: relative;

    z-index: 2;

    width: 100%;
    min-height: 100vh;

    padding: 30px 15px;

    text-align: center;
}

#menu {
    max-width: 600px;
    margin: auto;
    padding-top: 45px;
}

h1 {
    margin: 0;

    font-size:
        clamp(50px,14vw,85px);

    font-weight: 900;

    letter-spacing: 5px;

    color: #ff1010;

    text-shadow:
        0 0 5px red,
        0 0 15px red,
        0 0 35px #900,
        0 0 70px rgba(255,0,0,.6);

    animation: flicker 3s infinite;
}

@keyframes flicker {

    0%,18%,20%,60%,62%,100% {
        opacity: 1;
    }

    19%,61% {
        opacity: .35;
    }
}

h2 {
    color: #ff8a8a;
    letter-spacing: 3px;

    text-shadow:
        0 0 12px red;
}

.stats {
    margin: 30px auto;

    padding: 18px;

    max-width: 340px;

    background: rgba(0,0,0,.7);

    border:
        1px solid rgba(255,0,0,.4);

    border-radius: 12px;

    color: #ffd34e;

    box-shadow:
        0 0 25px rgba(255,0,0,.25);
}

button {
    border: none;

    border-radius: 10px;

    color: white;

    cursor: pointer;

    transition: .15s;
}

button:active {
    transform: scale(.94);
}

.start {
    width: min(330px,90%);

    height: 75px;

    font-size: 25px;

    font-weight: bold;

    background:
        linear-gradient(
            #b50000,
            #480000
        );

    box-shadow:
        0 0 25px rgba(255,0,0,.5);
}

.timer {
    font-size:
        clamp(75px,20vw,120px);

    font-weight: 900;

    color: #ff1111;

    text-shadow:
        0 0 8px red,
        0 0 25px red,
        0 0 60px red;

    animation:
        timerPulse 1s infinite alternate;
}

@keyframes timerPulse {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.06);
    }
}

input {
    width: min(340px,90%);

    height: 65px;

    border-radius: 10px;

    border: 1px solid #700000;

    outline: none;

    background: #050505;

    color: white;

    text-align: center;

    font-size: 25px;
}

.guess {
    width: 240px;

    height: 65px;

    margin: 20px auto;

    font-size: 24px;

    font-weight: bold;

    background:
        linear-gradient(
            #a00000,
            #420000
        );

    box-shadow:
        0 0 20px rgba(255,0,0,.45);
}

.message {
    min-height: 30px;

    margin: 15px;

    font-size: 20px;

    font-weight: bold;
}

#gameScreen {
    display: none;
}

@media(max-width:500px) {

    h1 {
        font-size: 55px;
    }

    .game {
        padding-top: 15px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div id="menu">

        <h1>GUESS 45</h1>

        <h2>
            THE 45 SECOND CHALLENGE
        </h2>

        <div class="stats">

            <div>
                LEVEL:
                <span id="level">1</span>
            </div>

            <div>
                COINS:
                <span id="coins">0</span>
            </div>

            <div>
                BEST:
                <span id="best">0</span>
            </div>

        </div>

        <button
            class="start"
            onclick="startGame()">

            START GAME

        </button>

    </div>


    <div id="gameScreen">

        <h2>GUESS THE NUMBER</h2>

        <div class="timer" id="timer">
            45
        </div>

        <div>
            Round:
            <span id="round">
                1
            </span>
        </div>

        <br>

        <input
            id="guessInput"
            type="number"
            min="1"
            max="100"
            placeholder="1 - 100">

        <br>

        <button
            class="guess"
            onclick="makeGuess()">

            GUESS

        </button>

        <div
            class="message"
            id="message">
        </div>

        <div>
            Score:
            <span id="score">
                0
            </span>
        </div>

        <br>

        <button
            class="start"
            onclick="location.reload()">

            MENU

        </button>

    </div>

</div>


<script>

let secretNumber;

let time = 45;

let timerInterval;

let score = 0;

let round = 1;

let coins = 0;

let best =
    Number(
        localStorage.getItem("guess45Best")
    ) || 0;


document.getElementById("best")
    .textContent = best;


function startGame() {

    document.getElementById("menu")
        .style.display = "none";

    document.getElementById("gameScreen")
        .style.display = "block";

    newRound();
}


function newRound() {

    secretNumber =
        Math.floor(
            Math.random() * 100
        ) + 1;

    time = 45;

    document.getElementById("timer")
        .textContent = time;

    document.getElementById("round")
        .textContent = round;

    document.getElementById("guessInput")
        .value = "";

    document.getElementById("message")
        .textContent = "";

    clearInterval(timerInterval);

    timerInterval =
        setInterval(timerTick,1000);
}


function timerTick() {

    time--;

    document.getElementById("timer")
        .textContent = time;

    if(time <= 0) {

        clearInterval(timerInterval);

        document.getElementById("message")
            .textContent =
            "TIME'S UP! 😈";

    }
}


function makeGuess() {

    let guess =
        Number(
            document.getElementById(
                "guessInput"
            ).value
        );

    if(!guess) return;

    if(guess === secretNumber) {

        clearInterval(timerInterval);

        score += 100;

        coins += 10;

        round++;

        document.getElementById("score")
            .textContent = score;

        document.getElementById("coins")
            .textContent = coins;

        if(score > best) {

            best = score;

            localStorage.setItem(
                "guess45Best",
                best
            );

            document.getElementById("best")
                .textContent = best;
        }

        document.getElementById("message")
            .textContent =
            "🔥 CORRECT! +100 SCORE";

        setTimeout(
            newRound,
            1000
        );

    }

    else if(guess > secretNumber) {

        document.getElementById("message")
            .textContent =
            "⬇️ LOWER!";

    }

    else {

        document.getElementById("message")
            .textContent =
            "⬆️ HIGHER!";

    }
}

</script>

</body>
</html>
